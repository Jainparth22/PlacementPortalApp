global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: ppa-web
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token     # written at container start from $METRICS_TOKEN (see docker-compose.yml)
    static_configs:
      - targets: ["web:5001"]

  # Celery task metrics (started / succeeded / failed / retried, runtime, workers online) come from Flower
  - job_name: ppa-celery-flower
    metrics_path: /metrics
    static_configs:
      - targets: ["flower:5555"]
