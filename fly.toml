# fly.toml app configuration file generated for ppa-v5 on 2026-08-27T15:20:38+05:30
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'ppa-v5'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  AUTO_SEED = '0'
  EXPORTS_FOLDER = '/data/exports'
  FLASK_ENV = 'production'
  PORT = '8080'
  REPORTS_FOLDER = '/data/reports'
  UPLOAD_FOLDER = '/data/uploads'

[processes]
  app = 'sh -c "celery --workdir backend -A celery_worker worker --loglevel=info & celery --workdir backend -A celery_worker beat --loglevel=info & gunicorn --chdir backend --workers 1 --threads 2 --timeout 120 --bind 0.0.0.0:8080 app:app"'

[[mounts]]
  source = 'ppa_data'
  destination = '/data'
  processes = ['app']

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
