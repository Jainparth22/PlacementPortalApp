name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends libpq-dev
          pip install -r requirements-dev.txt

      - name: Lint (flake8 - syntax errors, undefined names, unused imports)
        run: flake8

      - name: Type check (mypy - informational)
        run: mypy
        continue-on-error: true

      - name: API spec is valid OpenAPI
        run: python -c "import yaml; from openapi_spec_validator import validate; validate(yaml.safe_load(open('api.yaml', encoding='utf-8')))"

      - name: Unit + integration tests
        run: pytest -q

      - name: Migrations apply to a fresh database and match the models
        env:
          DATABASE_URL: sqlite:///${{ github.workspace }}/ci.db
          AUTO_MIGRATE: "0"
          AUTO_SEED: "0"
        run: |
          flask --app backend/app.py db upgrade
          flask --app backend/app.py db check

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t ppa:ci .
      - name: Validate compose file
        run: docker compose config -q
