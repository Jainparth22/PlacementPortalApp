openapi: 3.0.3
info:
  title: Placement Portal Application (PPA V5) API
  version: 1.0.0
  description: |
    RESTful API for a campus placement management system.
    Supports three roles: Admin, Company, and Student.

    **Versioning:** all endpoints live under `/api/v1/`. The old unversioned `/api/...` paths still
    work as a deprecated alias (responses carry `Deprecation: true` and a `Link: rel="successor-version"` header).

    **Headers:** every response has `X-Request-ID` (send your own to trace a call across services) and
    `X-Response-Time`. API responses are `Cache-Control: no-store`.

    **Sessions:** `POST /auth/login` returns a short-lived (15 min) **access token** in the body and sets two cookies:
    `ppa_refresh` (httpOnly, SameSite=Strict, Secure over HTTPS, path `/api/`) and `ppa_csrf` (readable by JS). Keep the access token
    in memory and send it as `Authorization: Bearer`. When it expires call `POST /auth/refresh` (cookie + `X-CSRF-Token` header equal
    to the `ppa_csrf` cookie): the refresh token is **rotated**, and re-using an old one revokes the whole session family.

    **Idempotency:** send `Idempotency-Key: <uuid>` on POSTs that create something (apply, create drive, schedule interview,
    generate report, export). A retry with the same key returns the original response (`Idempotent-Replay: true`) instead of
    repeating the action; the same key with a different body is `422`; a concurrent duplicate is `409` + `Retry-After`.

    **Live updates:** `GET /notifications/stream` is a Server-Sent Events stream (resume with `Last-Event-ID`).

    **Rate limits:** `429 Too Many Requests` + `Retry-After` on login (per IP and per account) and on the
    expensive per-user endpoints (report generation, CSV export, ATS check).

servers:
  - url: http://localhost:5001
    description: Local development server

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated unique key (8-128 chars). Retries with the same key return the original response.
      schema: {type: string, example: "3f1c9a52-7d1e-4c52-9a67-1a6b0e7b1c11"}

  responses:
    TooManyRequests:
      description: Rate limit exceeded
      headers:
        Retry-After:
          schema:
            type: integer
          description: Seconds until the limit resets
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
              retry_after:
                type: integer

  schemas:
    User:
      type: object
      properties:
        id:
          type: integer
        email:
          type: string
        role:
          type: string
          enum: [admin, company, student]
        is_active:
          type: boolean
        is_blacklisted:
          type: boolean
        created_at:
          type: string
          format: date-time
        last_login:
          type: string
          format: date-time

    StudentProfile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        full_name:
          type: string
        department:
          type: string
        cgpa:
          type: number
        graduation_year:
          type: integer
        resume_path:
          type: string
        phone:
          type: string
        bio:
          type: string
        email:
          type: string
        is_active:
          type: boolean
        is_blacklisted:
          type: boolean
        skills:
          type: array
          items:
            type: string

    CompanyProfile:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        company_name:
          type: string
        hr_name:
          type: string
        hr_email:
          type: string
        hr_phone:
          type: string
        website:
          type: string
        description:
          type: string
        industry:
          type: string
        company_size:
          type: string
        approval_status:
          type: string
          enum: [pending, approved, rejected]
        email:
          type: string
        is_active:
          type: boolean
        is_blacklisted:
          type: boolean

    PlacementDrive:
      type: object
      properties:
        id:
          type: integer
        company_id:
          type: integer
        company_name:
          type: string
        drive_name:
          type: string
        job_title:
          type: string
        job_description:
          type: string
        eligibility_branch:
          type: string
        min_cgpa:
          type: number
        eligible_year:
          type: integer
        application_deadline:
          type: string
          format: date-time
        location:
          type: string
        salary:
          type: string
        job_type:
          type: string
          enum: [Full-time, Internship, Contract]
        status:
          type: string
          enum: [pending, approved, rejected, closed]
        created_at:
          type: string
          format: date-time
        application_count:
          type: integer

    Application:
      type: object
      properties:
        id:
          type: integer
        student_id:
          type: integer
        drive_id:
          type: integer
        student_name:
          type: string
        student_email:
          type: string
        student_cgpa:
          type: number
        student_department:
          type: string
        drive_name:
          type: string
        company_name:
          type: string
        job_title:
          type: string
        application_date:
          type: string
          format: date-time
        status:
          type: string
          enum: [applied, shortlisted, selected, rejected, withdrawn]
        interview_type:
          type: string
        remarks:
          type: string
        cover_letter:
          type: string

    Interview:
      type: object
      properties:
        id:
          type: integer
        application_id:
          type: integer
        interview_date:
          type: string
          format: date-time
        mode:
          type: string
          enum: [Online, Offline]
        venue:
          type: string
        result:
          type: string
          enum: [pending, passed, failed]

    MonthlyReport:
      type: object
      properties:
        id:
          type: integer
        month:
          type: string
        total_drives:
          type: integer
        total_applications:
          type: integer
        total_selected:
          type: integer
        report_path:
          type: string
        created_at:
          type: string
          format: date-time

    Notification:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        message:
          type: string
        channel:
          type: string
        is_sent:
          type: boolean
        is_read:
          type: boolean
        created_at:
          type: string
          format: date-time

    AsyncJob:
      type: object
      properties:
        id:
          type: integer
        user_id:
          type: integer
        job_type:
          type: string
        status:
          type: string
          enum: [pending, running, completed, failed]
        file_path:
          type: string
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    Error:
      type: object
      properties:
        error:
          type: string

    Message:
      type: object
      properties:
        message:
          type: string

paths:
  /health:
    get:
      tags: [Operations]
      summary: Health of the app and its dependencies (unversioned)
      responses:
        "200":
          description: Healthy (database reachable). Redis/Celery being down only degrades features.
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: {type: string, enum: [ok, degraded]}
                  database: {type: string, description: "'postgres' key instead when running on PostgreSQL"}
                  redis:
                    type: object
                    properties:
                      cache: {type: string, enum: [connected, down]}
                      state: {type: string, enum: [connected, down]}
                  celery:
                    type: object
                    properties:
                      workers: {type: integer}
                      mode: {type: string, enum: [async, sync-fallback]}
                  cache: {type: object}
                  api_version: {type: string}
        "503":
          description: Database unreachable

  # ─── Authentication ───────────────────────────────────
  /api/v1/auth/login:
    post:
      tags: [Authentication]
      summary: User login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                password:
                  type: string
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  token:
                    type: string
                    description: Short-lived (15 min) access token. Also sets `ppa_refresh` (httpOnly) and `ppa_csrf` cookies.
                  token_type: {type: string, example: Bearer}
                  expires_in: {type: integer, example: 900}
                  user:
                    $ref: "#/components/schemas/User"
                  profile:
                    type: object
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/auth/refresh:
    post:
      tags: [Authentication]
      summary: Exchange the httpOnly refresh cookie for a new access token (rotates the refresh token)
      description: |
        Requires the `ppa_refresh` cookie **and** an `X-CSRF-Token` header equal to the `ppa_csrf` cookie (double-submit CSRF
        protection; a cross-origin `Origin` is rejected). Error `code`s: `missing`, `invalid`, `expired`, `revoked`,
        `reuse` (a rotated token was replayed - the whole session family is revoked), `race` (two tabs refreshed at once;
        harmless, retry), `forbidden` (account deactivated), `csrf`.
      parameters:
        - name: X-CSRF-Token
          in: header
          required: true
          schema: {type: string}
      responses:
        "200":
          description: New access token; new refresh/CSRF cookies set
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: {type: string}
                  token_type: {type: string, example: Bearer}
                  expires_in: {type: integer, example: 900}
                  user:
                    $ref: "#/components/schemas/User"
                  profile: {type: object}
        "401":
          description: Refresh failed (see `code`); cookies are cleared except for `race`
          content:
            application/json:
              schema:
                type: object
                properties:
                  error: {type: string}
                  code: {type: string}
        "403":
          description: CSRF check failed

  /api/v1/auth/logout-all:
    post:
      tags: [Authentication]
      summary: Revoke every session (all devices) of the current user
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All refresh tokens revoked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/notifications/stream:
    get:
      tags: [Notifications]
      summary: Live notifications (Server-Sent Events)
      description: |
        `text/event-stream`. Events: `ready`, `notification` (data = Notification JSON, `id:` = stream id), `reconnect`
        (server closes after `SSE_MAX_SECONDS`; reconnect with `Last-Event-ID`), plus `: keep-alive` comments.
        Delivery is at-least-once: de-duplicate by `data.id`. `503 stream_full` means use polling (`GET /notifications`).
        Browsers' `EventSource` cannot send an Authorization header, so read it with `fetch()` streaming.
      security:
        - BearerAuth: []
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: string, example: "1732290000000-0"}
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}
        "503":
          description: At capacity - fall back to polling

  /metrics:
    get:
      tags: [Operations]
      summary: Prometheus metrics (not for end users)
      description: Bearer `METRICS_TOKEN`. Open in development without a token, disabled (404) in production without one.
      responses:
        "200":
          description: Prometheus text exposition format
          content:
            text/plain:
              schema: {type: string}
        "401":
          description: Missing/invalid token

  /api/v1/auth/logout:
    post:
      tags: [Authentication]
      summary: Logout (blacklists the access token, revokes the refresh-token family, clears cookies)
      description: Idempotent. If the `ppa_refresh` cookie is present an `X-CSRF-Token` header is required. Works with an expired access token.
      security:
        - BearerAuth: []
        - {}
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/auth/me:
    get:
      tags: [Authentication]
      summary: Get current user info
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Current user details
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: "#/components/schemas/User"
                  profile:
                    type: object

  # ─── Notifications ────────────────────────────────────
  /api/v1/notifications:
    get:
      tags: [Notifications]
      summary: Get user notifications
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of notifications (max 50)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  /api/v1/notifications/{id}/read:
    put:
      tags: [Notifications]
      summary: Mark a notification as read
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Notification marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/notifications/read-all:
    put:
      tags: [Notifications]
      summary: Mark all notifications as read
      security:
        - BearerAuth: []
      responses:
        "200":
          description: All notifications marked as read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  # ─── Async Jobs ───────────────────────────────────────
  /api/v1/jobs/{job_id}:
    get:
      tags: [Jobs]
      summary: Get async job status
      security:
        - BearerAuth: []
      parameters:
        - name: job_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AsyncJob"

  # ─── Admin ────────────────────────────────────────────
  /api/v1/admin/dashboard:
    get:
      tags: [Admin]
      summary: Get admin dashboard statistics
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Dashboard stats with chart data
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_students:
                    type: integer
                  total_companies:
                    type: integer
                  total_drives:
                    type: integer
                  total_applications:
                    type: integer
                  selected_students:
                    type: integer
                  pending_companies:
                    type: integer
                  pending_drives:
                    type: integer
                  blacklisted_users:
                    type: integer
                  chart_app_status:
                    type: object
                  chart_drive_status:
                    type: object

  /api/v1/admin/search:
    get:
      tags: [Admin]
      summary: Search companies or students
      security:
        - BearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: type
          in: query
          required: true
          schema:
            type: string
            enum: [companies, students]
      responses:
        "200":
          description: Search results
          content:
            application/json:
              schema:
                type: object

  /api/v1/admin/companies:
    get:
      tags: [Admin]
      summary: List all companies
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of company profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyProfile"

  /api/v1/admin/companies/pending:
    get:
      tags: [Admin]
      summary: List pending companies
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Companies awaiting approval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CompanyProfile"

  /api/v1/admin/companies/{id}/approve:
    put:
      tags: [Admin]
      summary: Approve a company
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Company approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/admin/companies/{id}/reject:
    put:
      tags: [Admin]
      summary: Reject a company
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remarks:
                  type: string
      responses:
        "200":
          description: Company rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/admin/companies/{id}/blacklist:
    put:
      tags: [Admin]
      summary: Blacklist or unblacklist a company
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [blacklist, unblacklist]
      responses:
        "200":
          description: Blacklist status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/admin/drives:
    get:
      tags: [Admin]
      summary: List all placement drives
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, approved, rejected, closed]
      responses:
        "200":
          description: List of drives
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlacementDrive"

  /api/v1/admin/drives/pending:
    get:
      tags: [Admin]
      summary: List pending drives
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Drives awaiting approval
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlacementDrive"

  /api/v1/admin/drives/{id}/approve:
    put:
      tags: [Admin]
      summary: Approve a drive
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Drive approved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/admin/drives/{id}/reject:
    put:
      tags: [Admin]
      summary: Reject a drive
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                remarks:
                  type: string
      responses:
        "200":
          description: Drive rejected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/admin/drives/{id}/close:
    put:
      tags: [Admin]
      summary: Close a drive
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Drive closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/admin/students:
    get:
      tags: [Admin]
      summary: List all students
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of student profiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StudentProfile"

  /api/v1/admin/students/{id}/deactivate:
    put:
      tags: [Admin]
      summary: Activate or deactivate a student
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [activate, deactivate]
      responses:
        "200":
          description: Student status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/admin/students/{id}/blacklist:
    put:
      tags: [Admin]
      summary: Blacklist or unblacklist a student
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                action:
                  type: string
                  enum: [blacklist, unblacklist]
      responses:
        "200":
          description: Blacklist status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"

  /api/v1/admin/applications:
    get:
      tags: [Admin]
      summary: List all applications (with optional filters)
      security:
        - BearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [applied, shortlisted, selected, rejected, withdrawn]
        - name: drive_id
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Application"

  /api/v1/admin/reports/monthly:
    get:
      tags: [Admin]
      summary: List monthly reports
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of reports
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyReport"

  /api/v1/admin/reports/generate:
    post:
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      tags: [Admin]
      summary: Trigger monthly report generation (async Celery task)
      security:
        - BearerAuth: []
      responses:
        "202":
          description: Report generation started
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                  job_id:
                    type: integer
                  mode:
                    type: string
                    enum: [queued, sync]
                    description: "`queued` = handed to a Celery worker, `sync` = no worker alive so it ran inline"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /api/v1/admin/cache-stats:
    get:
      tags: [Admin]
      summary: Cache hit/miss statistics for this process
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Cache statistics
          content:
            application/json:
              schema:
                type: object
                properties:
                  hits: {type: integer}
                  misses: {type: integer}
                  hit_rate: {type: number, nullable: true}
                  backend: {type: string, enum: [redis, memory]}
                  memory_items: {type: integer}

  /api/v1/admin/dead-letters:
    get:
      tags: [Admin]
      summary: Background tasks that failed permanently (dead-letter queue)
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, default: 50, maximum: 100}
      responses:
        "200":
          description: Dead-lettered tasks, newest first
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        task: {type: string}
                        task_id: {type: string}
